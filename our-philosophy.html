<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Philosophy — Pellucid Frames</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: "#000000", paper: "#F9EFE8", volt: "#FDDA10" },
          fontFamily: { display: ["Geologica", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Spotlight hero + shared `wp-` system from Why Pellucid for the text sections. -->
  <style>
    /* ---------- Spotlight hero ---------- */
    .op-hero {
      position: relative;
      height: 100svh;
      background: var(--ink);
      overflow: hidden;
      /* spotlight position + radius, updated by rAF in our-philosophy.jsx */
      --sx: 50%;
      --sy: 42%;
      --r: 30vmax;
    }
    /* the background image, revealed only where the spotlight mask falls */
    .op-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(.92) saturate(.9);
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--sx) var(--sy), #000 0%, #000 24%, rgba(0,0,0,.18) 58%, transparent 74%);
              mask-image: radial-gradient(circle var(--r) at var(--sx) var(--sy), #000 0%, #000 24%, rgba(0,0,0,.18) 58%, transparent 74%);
    }
    /* faint beam glow so the spotlight reads even over dark ground */
    .op-hero-light {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle var(--r) at var(--sx) var(--sy), rgba(249,239,232,.10), transparent 66%);
      mix-blend-mode: screen;
    }
    /* old-film damage — canvas painted each frame with scratches, dust,
       flicker, weave and the odd burn (see our-philosophy.jsx). */
    .op-damage {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      width: 100%;
      height: 100%;
      opacity: .6;
      mix-blend-mode: screen;
    }
    /* darken the bottom so the title stays legible over the image */
    .op-hero-fade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 52%, rgba(0,0,0,.72) 86%, var(--ink) 100%);
    }
    .op-eyebrow {
      position: absolute;
      top: clamp(92px, 14vh, 140px);
      left: 0; right: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: clamp(16px, 4vw, 48px);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--paper-50);
    }
    /* big bold title, stretched edge-to-edge and pinned to the bottom */
    .op-title {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      margin: 0;
      padding: 0 clamp(10px, 1.5vw, 26px) clamp(6px, 1.6vh, 20px);
    }
    .op-title svg { display: block; width: 100%; }
    .op-title text {
      fill: var(--paper);
      font-family: "Geologica", sans-serif;
      font-weight: 800;
    }

    /* ---------- Principles: full-bleed sharp panels below the hero ---------- */
    .op-body-wrap {
      position: relative;
      background: var(--ink);
      color: var(--paper);
      padding: clamp(80px, 14vh, 180px) 0 clamp(80px, 14vh, 200px);
    }
    /* section opener (contained) */
    .op-head {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 clamp(24px, 6vw, 80px) clamp(28px, 5vh, 56px);
    }
    .op-ledger-head {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper-50);
    }
    .op-ledger-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .op-ledger-head b { color: var(--volt); font-weight: 500; }

    /* full-bleed panels: number | title | copy, split by solid dividers; each
       sticks and the next overlaps it on scroll (--i = index). */
    .op-stack { position: relative; }
    .op-panel {
      position: sticky;
      top: calc(clamp(60px, 9vh, 96px) + var(--i) * 12px);
      display: grid;
      grid-template-columns: minmax(0, 2.5fr) minmax(0, 5fr) minmax(0, 6fr);
      min-height: clamp(460px, 82vh, 880px);
      background: var(--ink); /* opaque so a stacked panel fully covers */
      border-top: 1px solid var(--line);
    }
    .op-panel:last-child { border-bottom: 1px solid var(--line); }
    .op-col {
      display: flex;
      flex-direction: column;
      padding: clamp(28px, 3vw, 56px);
      min-width: 0;
    }
    .op-col--title, .op-col--copy { border-left: 1px solid var(--line); }
    .op-num {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(14px, 1.4vw, 20px);
      letter-spacing: 0.1em;
      color: var(--paper);
    }
    .op-num i { color: var(--volt); font-style: normal; margin-left: 8px; }
    .op-ptitle {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 3.4vw, 58px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin: 0;
      max-width: 15ch;
      text-wrap: balance;
    }
    .op-pbody {
      font-family: "Geologica", sans-serif;
      font-weight: 300;
      font-size: clamp(16px, 1.4vw, 21px);
      line-height: 1.55;
      color: var(--paper-50);
      max-width: 46ch;
      text-wrap: pretty;
    }
    .op-pbody p { margin: 0; }
    .op-pbody p + p { margin-top: clamp(14px, 2vh, 22px); }
    .op-pbody b { color: var(--paper); font-weight: 500; }

    @media (max-width: 860px) {
      .op-panel { position: static; grid-template-columns: 1fr; min-height: 0; }
      .op-col--title, .op-col--copy { border-left: none; border-top: 1px solid var(--line); }
    }
  </style>
</head>

<body>
  <div id="op-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/footer.jsx?v=23"></script>
  <script type="text/babel" src="src/app.jsx?v=28"></script>
  <script type="text/babel" src="src/our-philosophy.jsx?v=14"></script>
</body>

</html>
