<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Work — Pellucid Frames</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: "#000000", paper: "#F9EFE8", volt: "#FDDA10" },
          fontFamily: { display: ["Geologica", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ---------- Hero: full-screen push-wipe slideshow ----------
       Next slide clip-path-wipes in from the right while the current wipes out
       left, in sync — reads as one image pushing the other (our-work.jsx). */
    .ow-hero {
      position: relative;
      height: 100svh;
      background: var(--ink);
      color: var(--paper);
      overflow: hidden;
    }
    .ow-slides { position: absolute; inset: 0; }
    .ow-slide {
      position: absolute;
      inset: 0;
      will-change: clip-path;
    }
    .ow-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.78) saturate(0.92);
    }
    .ow-hero-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      /* uniform tint so the centred title stands out, + extra darkening at the edges */
      background:
        linear-gradient(rgba(0,0,0,0.42), rgba(0,0,0,0.42)),
        linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%);
    }
    .ow-eyebrow {
      position: absolute;
      top: clamp(92px, 14vh, 140px);
      left: 0; right: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: clamp(16px, 4vw, 48px);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--paper-50);
    }
    /* band: rotating discipline tag top-centre, sitting on a full-bleed hairline */
    .ow-hero-band {
      position: absolute;
      z-index: 3;
      top: clamp(140px, 24vh, 240px);
      left: 0;
      right: 0;
    }
    .ow-band-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      gap: 16px;
      padding: 0 clamp(24px, 6vw, 80px);
      margin-bottom: 12px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .ow-tag-name { grid-column: 2; overflow: hidden; color: var(--paper); }
    .ow-tag-name span {
      display: inline-block;
      animation: owTagUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes owTagUp {
      from { transform: translateY(120%); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .ow-tag-count { grid-column: 3; justify-self: end; color: var(--paper-50); }
    .ow-tag-count b { color: var(--volt); font-weight: 500; }
    .ow-band-line { height: 1px; background: var(--paper-25); }
    /* title dead-centre over the slideshow */
    .ow-hero-center {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .ow-title {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(64px, 14vw, 230px);
      line-height: 0.9;
      letter-spacing: -0.035em;
      margin: 0;
      text-align: center;
    }
    .ow-accent { color: var(--volt); }
    /* ---------- Statement: scroll-fill text + parallax images ----------
       Words start as ghost paper-12 and fill to full paper as one rAF scrubs
       section progress; surrounding stills parallax at different speeds. */
    .ow-statement {
      position: relative;
      background: var(--ink);
      color: var(--paper);
      margin-top: clamp(60px, 12vh, 160px);
      padding: clamp(140px, 24vh, 280px) clamp(24px, 6vw, 80px);
      overflow: hidden;
    }
    .ow-stmt-banner {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(24px, 4vw, 64px);
      min-width: min(560px, 72vw);
      background: var(--volt);
      color: #000;
      padding: 13px clamp(16px, 2.4vw, 28px);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .ow-stmt-banner b { font-size: 15px; font-weight: 600; }
    .ow-stmt-text {
      position: relative;
      z-index: 2;
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(38px, 7.4vw, 118px);
      line-height: 0.96;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-align: center;
      margin: 0 auto;
      max-width: 1500px;
      text-wrap: balance;
    }
    .ow-stmt-w { color: var(--paper-12); }
    .ow-stmt-img {
      position: absolute;
      width: clamp(170px, 21vw, 360px);
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border: 1px solid var(--paper-12);
      border-radius: 8px;
      box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.9);
      filter: brightness(0.85) saturate(0.9);
      will-change: transform;
    }
    /* scatter — i1/i4 float above the text like the reference, i2/i3 behind */
    .ow-stmt-i1 { top: 6%;  left: 5%;  width: clamp(220px, 26vw, 430px); z-index: 3; }
    .ow-stmt-i2 { top: 34%; right: 3%; z-index: 1; }
    .ow-stmt-i3 { bottom: 14%; left: 4%; z-index: 1; }
    .ow-stmt-i4 { bottom: 3%; right: 9%; width: clamp(150px, 17vw, 290px); z-index: 3; }
    @media (max-width: 860px) {
      .ow-statement { padding-top: clamp(110px, 18vh, 160px); }
      .ow-stmt-i3, .ow-stmt-i4 { display: none; }
      .ow-stmt-i1 { width: 38vw; }
      .ow-stmt-i2 { width: 34vw; }
    }
    /* ---------- Shared section chrome ---------- */
    .ow-section {
      position: relative;
      background: var(--ink);
      color: var(--paper);
      padding: clamp(88px, 15vh, 200px) clamp(24px, 7vw, 130px);
    }
    .ow-section-inner { max-width: 1200px; margin: 0 auto; }
    .ow-kicker {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper-50);
      margin-bottom: clamp(24px, 4vh, 44px);
    }
    .ow-kicker::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--volt);
    }
    .ow-lead {
      font-family: "Geologica", sans-serif;
      font-weight: 300;
      font-size: clamp(22px, 2.8vw, 44px);
      line-height: 1.28;
      letter-spacing: -0.012em;
      margin: 0;
      text-wrap: pretty;
    }
    .ow-lead b { font-weight: 600; color: var(--paper); }

    /* ---------- Disciplines: centre-scroll highlight list ----------
       The list scrolls naturally; whichever name crosses viewport centre goes
       volt while a pinned still + one-liner beside it swap to match
       (nearest-to-centre rAF in our-work.jsx). */
    .ow-disc {
      position: relative;
      background: var(--ink);
      color: var(--paper);
      padding: clamp(100px, 18vh, 220px) clamp(24px, 6vw, 80px);
      max-width: 1600px;
      margin: 0 auto;
    }
    .ow-disc-h {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5.2vw, 82px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin: 0 0 clamp(48px, 9vh, 110px);
      max-width: 22ch;
      text-wrap: balance;
    }
    .ow-disc-h b { color: var(--volt); font-weight: 800; }
    .ow-disc-body {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: clamp(28px, 5vw, 90px);
    }
    .ow-disc-list { display: flex; flex-direction: column; }
    .ow-disc-name {
      font-family: "Geologica", sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 2.5vw, 42px);
      line-height: 1.35;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: var(--paper);
      transition: color 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: default;
      width: fit-content;
    }
    .ow-disc-name.on { color: var(--volt); }
    .ow-disc-side {
      position: sticky;
      top: 24vh;
      align-self: start;
      display: flex;
      align-items: center;
      gap: clamp(20px, 2.5vw, 44px);
      min-width: 0;
    }
    .ow-disc-media {
      position: relative;
      width: clamp(240px, 27vw, 480px);
      aspect-ratio: 4 / 3;
      flex: 0 0 auto;
    }
    .ow-disc-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--paper-12);
      box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: scale(0) rotate(45deg) translateY(30%);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s;
      will-change: transform;
    }
    .ow-disc-media img.on { opacity: 1; transform: none; }
    .ow-disc-lines { position: relative; flex: 1 1 auto; min-height: 7em; min-width: 0; }
    .ow-disc-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      translate: 0 -50%;
      font-weight: 300;
      font-size: clamp(15px, 1.5vw, 20px);
      line-height: 1.5;
      color: var(--paper-50);
      opacity: 0;
      transform: translateX(9%) scale(0.92);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
      text-wrap: pretty;
    }
    .ow-disc-line.on { opacity: 1; transform: none; transition-delay: 0.08s; }
    @media (max-width: 980px) {
      .ow-disc-body { grid-template-columns: 1fr; gap: clamp(20px, 5vw, 40px); }
      .ow-disc-side { display: none; }
      .ow-disc-name { white-space: normal; }
    }

    /* ---------- Portfolio gallery: full-screen zoom sequence ----------
       Tall track scrubbed by scroll (scrollscene.jsx pattern); a sticky, full
       viewport holds full-bleed images. Each continuously zooms in across its
       window and crossfades — the next zooms in as the current zooms out. */
    .ow-deck-track { position: relative; background: var(--ink); }
    .ow-deck-viewport {
      position: sticky;
      top: 0;
      height: 100svh;
      overflow: hidden;
      background: var(--ink);
    }
    .ow-zoom {
      position: absolute;
      inset: 0;
      will-change: transform, opacity;
    }
    .ow-zoom img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* reduced motion: sequence degrades to a plain vertical list */
    .ow-static .ow-deck-viewport { position: static; height: auto; overflow: visible; }
    .ow-static .ow-zoom {
      position: static;
      opacity: 1 !important;
      transform: none !important;
      visibility: visible !important;
    }
    .ow-static .ow-zoom img { height: auto; aspect-ratio: 16 / 9; }

    /* ---------- Looking ahead ---------- */
    .ow-statement-h {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(38px, 7.2vw, 108px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      margin: 0 0 clamp(28px, 5vh, 56px);
      text-wrap: balance;
    }
    .ow-body {
      font-weight: 300;
      font-size: clamp(16px, 1.5vw, 21px);
      line-height: 1.6;
      color: var(--paper-50);
      max-width: 52ch;
      margin: clamp(28px, 4vh, 48px) 0 0;
      text-wrap: pretty;
    }
    .ow-ambition {
      margin-top: clamp(56px, 10vh, 120px);
      padding-top: clamp(28px, 5vh, 56px);
      border-top: 1px solid var(--line);
    }
    .ow-ambition-pre {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--paper-50);
      margin-bottom: clamp(20px, 3vh, 36px);
    }
    .ow-ambition-h {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(30px, 5.4vw, 84px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin: 0;
      max-width: 18ch;
      text-wrap: balance;
    }

    /* ---------- Scroll reveal ---------- */
    .ow-reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ow-reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .ow-reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>

<body>
  <div id="ow-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/footer.jsx?v=25"></script>
  <script type="text/babel" src="src/app.jsx?v=30"></script>
  <script type="text/babel" src="src/our-work.jsx?v=10"></script>
</body>

</html>
