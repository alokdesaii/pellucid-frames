<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Pellucid Frames</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: "#000000", paper: "#F9EFE8", volt: "#FDDA10" },
          fontFamily: { display: ["Geologica", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ---------- Contact — split layout, multi-step form ---------- */
    .ct-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100svh;
      background: var(--ink);
      color: var(--paper);
    }
    .ct-col {
      padding: clamp(120px, 20vh, 220px) clamp(24px, 5vw, 76px) clamp(48px, 8vh, 88px);
      display: flex;
      flex-direction: column;
    }
    .ct-right { border-left: 1px solid var(--line); }

    /* left */
    .ct-title {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(52px, 8vw, 132px);
      line-height: 0.9;
      letter-spacing: -0.035em;
      margin: 0;
    }
    .ct-lead {
      font-family: "Geologica", sans-serif;
      font-weight: 300;
      font-size: clamp(20px, 2.4vw, 34px);
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--paper-50);
      max-width: 20ch;
      margin: clamp(28px, 4vh, 48px) 0 0;
      padding-bottom: clamp(32px, 5vh, 56px);
      border-bottom: 1px solid var(--line);
    }
    .ct-info {
      margin-top: auto;
      padding-top: clamp(40px, 7vh, 80px);
      display: grid;
      gap: clamp(20px, 3vh, 32px);
    }
    .ct-info-block { display: grid; gap: 6px; }
    .ct-info-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--paper-50);
    }
    .ct-info a, .ct-info span { color: var(--paper); text-decoration: none; font-size: clamp(15px, 1.2vw, 18px); }
    .ct-info a:hover { color: var(--volt); }
    .ct-socials { display: flex; gap: 20px; }
    .ct-socials a { font-size: 13px; letter-spacing: 0.04em; color: var(--paper-50); }
    .ct-socials a:hover { color: var(--volt); }

    /* right — step machine */
    .ct-stepline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: var(--paper-50);
      margin-bottom: clamp(36px, 6vh, 64px);
    }
    .ct-stepline b { color: var(--paper); font-weight: 500; }
    .ct-stepline .ct-step-name { text-transform: uppercase; font-size: 11px; }

    .ct-fields { display: flex; flex-direction: column; }
    .ct-field {
      display: flex;
      align-items: baseline;
      gap: clamp(16px, 3vw, 40px);
      padding: clamp(16px, 2vw, 24px) 0;
      border-bottom: 1px solid var(--line);
      transition: border-color 0.25s;
    }
    .ct-field:focus-within { border-color: var(--volt); }
    .ct-field.ct-err { border-color: var(--volt); }
    .ct-field-top { align-items: flex-start; }
    .ct-label {
      flex: 0 0 auto;
      width: clamp(110px, 16vw, 210px);
      font-family: "Geologica", sans-serif;
      font-weight: 600;
      font-size: clamp(15px, 1.15vw, 19px);
      letter-spacing: -0.01em;
      padding-top: 2px;
    }
    .ct-label .req { color: var(--volt); }
    .ct-control {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--paper);
      font-family: "Geologica", sans-serif;
      font-weight: 400;
      font-size: clamp(15px, 1.15vw, 19px);
      letter-spacing: -0.005em;
    }
    .ct-control::placeholder { color: var(--paper-25); }
    select.ct-control { cursor: pointer; -webkit-appearance: none; appearance: none; }
    select.ct-control option { background: #111; color: var(--paper); }
    select.ct-control:invalid { color: var(--paper-25); }
    textarea.ct-control { resize: vertical; min-height: 4.4em; line-height: 1.5; }
    .ct-err-msg {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--volt);
    }

    /* actions */
    .ct-actions {
      display: flex;
      gap: 16px;
      margin-top: clamp(40px, 6vh, 72px);
      flex-wrap: wrap;
    }
    .ct-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(24px, 4vw, 56px);
      min-width: 220px;
      padding: 16px 20px;
      border: 1px solid var(--paper-25);
      background: transparent;
      color: var(--paper);
      font-family: "Geologica", sans-serif;
      font-weight: 500;
      font-size: clamp(15px, 1.2vw, 18px);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
    }
    .ct-btn .ct-arrow { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .ct-btn:hover { border-color: var(--volt); color: var(--volt); }
    .ct-btn:hover .ct-arrow { transform: translateX(6px); }
    .ct-btn--primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
    .ct-btn--primary:hover { background: var(--volt); border-color: var(--volt); color: var(--ink); }
    .ct-btn--ghost { min-width: 0; color: var(--paper-50); }
    .ct-btn--ghost .ct-arrow { transform: scaleX(-1); }
    .ct-btn--ghost:hover .ct-arrow { transform: scaleX(-1) translateX(6px); }

    /* success */
    .ct-done { max-width: 34ch; }
    .ct-done-h {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(30px, 4vw, 60px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin: 0 0 clamp(20px, 3vh, 32px);
    }
    .ct-done-h .ct-accent { color: var(--volt); }
    .ct-done p { font-weight: 300; font-size: clamp(16px, 1.4vw, 21px); line-height: 1.55; color: var(--paper-50); margin: 0; }

    @media (max-width: 900px) {
      .ct-wrap { grid-template-columns: 1fr; }
      .ct-right { border-left: none; border-top: 1px solid var(--line); }
      .ct-col { padding-top: clamp(110px, 16vh, 160px); }
      .ct-left { padding-bottom: clamp(32px, 5vh, 48px); }
      .ct-info { margin-top: clamp(40px, 7vh, 72px); }
    }
    @media (max-width: 560px) {
      .ct-field { flex-direction: column; align-items: stretch; gap: 8px; }
      .ct-label { width: auto; }
      .ct-btn { min-width: 0; flex: 1; }
    }
  </style>
</head>

<body>
  <div id="ct-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/footer.jsx?v=24"></script>
  <script type="text/babel" src="src/app.jsx?v=30"></script>
  <script type="text/babel" src="src/contact.jsx?v=4"></script>
</body>

</html>
