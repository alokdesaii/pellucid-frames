<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Philosophy — Pellucid Frames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: "#000000", paper: "#F9EFE8", volt: "#FDDA10" },
          fontFamily: { display: ["Geologica", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Spotlight hero + shared `wp-` system from Why Pellucid for the text sections. -->
  <style>
    /* ---------- Spotlight hero ---------- */
    .op-hero {
      position: relative;
      height: 100svh;
      background: var(--ink);
      overflow: hidden;
      /* spotlight position + radius, updated by rAF in our-philosophy.jsx */
      --sx: 50%;
      --sy: 42%;
      --r: 30vmax;
    }
    /* the background image, revealed only where the spotlight mask falls */
    .op-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(.92) saturate(.9);
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--sx) var(--sy), #000 0%, #000 24%, rgba(0,0,0,.18) 58%, transparent 74%);
              mask-image: radial-gradient(circle var(--r) at var(--sx) var(--sy), #000 0%, #000 24%, rgba(0,0,0,.18) 58%, transparent 74%);
    }
    /* faint beam glow so the spotlight reads even over dark ground */
    .op-hero-light {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle var(--r) at var(--sx) var(--sy), rgba(249,239,232,.10), transparent 66%);
      mix-blend-mode: screen;
    }
    /* old-film damage — canvas painted each frame with scratches, dust,
       flicker, weave and the odd burn (see our-philosophy.jsx). */
    .op-damage {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      width: 100%;
      height: 100%;
      opacity: .6;
      mix-blend-mode: screen;
    }
    /* darken the bottom so the title stays legible over the image */
    .op-hero-fade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 52%, rgba(0,0,0,.72) 86%, var(--ink) 100%);
    }
    .op-eyebrow {
      position: absolute;
      top: clamp(92px, 14vh, 140px);
      left: 0; right: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: clamp(16px, 4vw, 48px);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--paper-50);
    }
    /* big bold title, stretched edge-to-edge and pinned to the bottom */
    .op-title {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      margin: 0;
      padding: 0 clamp(10px, 1.5vw, 26px) clamp(6px, 1.6vh, 20px);
    }
    .op-title svg { display: block; width: 100%; }
    .op-title text {
      fill: var(--paper);
      font-family: "Geologica", sans-serif;
      font-weight: 800;
    }

    /* ---------- Principles ledger below the hero ---------- */
    .op-body-wrap {
      position: relative;
      background: var(--ink);
      color: var(--paper);
      padding: clamp(80px, 14vh, 180px) clamp(24px, 7vw, 130px) clamp(96px, 18vh, 220px);
    }
    .op-ledger { max-width: 1200px; margin: 0 auto; }

    /* section opener */
    .op-ledger-head {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: clamp(28px, 5vh, 56px);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper-50);
    }
    .op-ledger-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .op-ledger-head b { color: var(--volt); font-weight: 500; }

    /* stacked cards — each sticks under the nav and the next scrolls up and
       overlaps it, leaving a small peek of the card beneath (--i = index). */
    .op-card {
      position: sticky;
      top: calc(clamp(84px, 11vh, 120px) + var(--i) * 14px);
      display: flex;
      flex-direction: column;
      min-height: clamp(400px, 68vh, 660px);
      padding: clamp(30px, 4.6vw, 68px);
      border: 1px solid var(--line);
      border-radius: clamp(20px, 2.2vw, 34px);
      /* opaque: solid ink base + faint paper tint, so stacked cards fully cover */
      background: linear-gradient(0deg, rgba(249, 239, 232, 0.05), rgba(249, 239, 232, 0.05)), var(--ink);
      box-shadow: 0 -28px 70px -38px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }
    .op-card + .op-card { margin-top: clamp(22px, 4vh, 56px); }
    .op-card-num {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--volt);
    }
    .op-card-h {
      font-family: "Geologica", sans-serif;
      font-weight: 800;
      font-size: clamp(30px, 4.4vw, 66px);
      line-height: 1;
      letter-spacing: -0.03em;
      margin: clamp(16px, 2vw, 28px) 0 0;
      max-width: 16ch;
      text-wrap: balance;
    }
    /* body pinned toward the card's base so the tall card reads airy, like the ref */
    .op-card-body-wrap { margin-top: auto; padding-top: clamp(28px, 5vh, 60px); }
    .op-card-body {
      font-weight: 300;
      font-size: clamp(16px, 1.5vw, 22px);
      line-height: 1.5;
      letter-spacing: -0.005em;
      color: var(--paper-50);
      max-width: 62ch;
      margin: 0 0 clamp(16px, 2.2vh, 26px);
      text-wrap: pretty;
    }
    .op-card-body:last-child { margin-bottom: 0; }
    .op-card-body b { color: var(--paper); font-weight: 500; }

    /* scroll reveal */
    .op-reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .op-reveal.in { opacity: 1; transform: none; }

    @media (max-width: 820px) {
      .op-card { min-height: clamp(360px, 62vh, 560px); top: clamp(72px, 10vh, 96px); }
      .op-card-h { font-size: clamp(28px, 8vw, 46px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .op-reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>

<body>
  <div id="op-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/footer.jsx?v=2"></script>
  <script type="text/babel" src="src/app.jsx?v=3"></script>
  <script type="text/babel" src="src/our-philosophy.jsx?v=13"></script>
</body>

</html>
